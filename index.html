<script>
var currentOp='format'
var SAMPLE='{"users":[{"id":1,"name":"Alice","email":"alice@example.com","role":"admin","active":true,"created":"2024-01-15"},{"id":2,"name":"Bob","email":"bob@example.com","role":"user","active":true,"created":"2024-02-20"},{"id":3,"name":"Carol","email":"carol@example.com","role":"guest","active":false,"created":"2024-03-10"}],"meta":{"total":3,"page":1,"perPage":10},"timestamp":1698000000000}'

// ── Tab switching ────────────────────────────────────────
function setOp(op){
  currentOp=op
  document.querySelectorAll('.et').forEach(function(t){t.classList.remove('active')})
  var btn=document.getElementById('et-'+op)
  if(btn)btn.classList.add('active')
  // Diff mode needs second input visible
  var diffRow=document.getElementById('diff-row')
  if(diffRow)diffRow.style.display=op==='diff'?'block':'none'
  // JSONPath needs query bar
  var jpRow=document.getElementById('jp-row')
  if(jpRow)jpRow.style.display=op==='jsonpath'?'flex':'none'
  // TypeScript mode message
  if(op==='typescript')document.getElementById('input').placeholder='Paste JSON here to generate TypeScript types…'
  else if(op==='diff')document.getElementById('input').placeholder='Paste first JSON here…'
  else document.getElementById('input').placeholder='Paste JSON here...\n\n{\n  "name": "Universe Invedors",\n  "tools": 14,\n  "free": true\n}'
  runOp()
}

// ── Main operation router ────────────────────────────────
function runOp(){
  var input=document.getElementById('input').value.trim()
  if(!input){document.getElementById('output-area').innerHTML='<div class="empty-msg">Paste JSON in the input panel to begin.</div>';return}
  var out=document.getElementById('output-area')
  out.innerHTML=''

  // Diff is handled separately (needs two inputs)
  if(currentOp==='diff'){runDiff();return}
  if(currentOp==='jsonpath'){runJSONPath();return}

  try{
    var parsed=JSON.parse(input)
    if(currentOp==='format'){
      out.innerHTML=syntaxHighlight(JSON.stringify(parsed,null,2))
      setStatus('Formatted ✓ — '+JSON.stringify(parsed).length+' bytes','ok')
    }else if(currentOp==='minify'){
      var min=JSON.stringify(parsed)
      out.innerHTML=syntaxHighlight(min)
      setStatus('Minified ✓ — saved '+(JSON.stringify(parsed,null,2).length-min.length)+' bytes','ok')
    }else if(currentOp==='validate'){
      var info=analyseJSON(parsed)
      out.innerHTML='<div class="ok-msg">✓ Valid JSON<br><small style="color:var(--text-3)">'+info+'</small></div>'
      setStatus('Valid ✓','ok')
    }else if(currentOp==='csv'){
      var csv=jsonToCSV(parsed)
      out.textContent=csv
      setStatus('Converted ✓','ok')
    }else if(currentOp==='yaml'){
      if(window.jsyaml){
        out.textContent=jsyaml.dump(parsed)
        setStatus('YAML ✓','ok')
      }else{out.innerHTML='<div class="err">YAML library not loaded — reload and try again.</div>'}
    }else if(currentOp==='tree'){
      out.innerHTML='<div style="font-family:var(--font-mono);font-size:13px;line-height:1.7">'+jsonToTree(parsed,'root',true)+'</div>'
      setStatus('Tree view ✓','ok')
    }else if(currentOp==='typescript'){
      out.textContent=jsonToTypeScript(parsed,'Root')
      setStatus('Types generated ✓','ok')
    }
  }catch(e){
    out.innerHTML='<div class="err">⚠ '+escKey(e.message)+'</div>'
    setStatus('Parse error','err')
  }
}

// ── Analyse JSON structure ───────────────────────────────
function analyseJSON(obj){
  var keys=0,depth=0
  function walk(v,d){
    if(d>depth)depth=d
    if(typeof v==='object'&&v!==null){
      Object.keys(v).forEach(function(k){keys++;walk(v[k],d+1)})
    }
  }
  walk(obj,0)
  var size=JSON.stringify(obj).length
  var type=Array.isArray(obj)?'Array['+obj.length+']':'Object'
  return type+' · '+keys+' keys · max depth '+depth+' · '+size+' bytes'
}

// ── Syntax highlighter (XSS-safe) ───────────────────────
function escKey(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function syntaxHighlight(json){
  var esc=json.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  return esc.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+\-]?\d+)?)/g,function(match){
    var cls='json-number'
    if(/^"/.test(match)){cls=/:$/.test(match)?'json-key':'json-string'}
    else if(/true|false/.test(match)){cls='json-bool'}
    else if(/null/.test(match)){cls='json-null'}
    return '<span class="'+cls+'">'+match+'</span>'
  })
}

// ── Real JSON Diff ───────────────────────────────────────
function runDiff(){
  var a=document.getElementById('input').value.trim()
  var b=(document.getElementById('diff-input2')||{value:''}).value.trim()
  if(!a||!b){
    document.getElementById('output-area').innerHTML='<div class="empty-msg">Paste JSON A in the left panel and JSON B in the right panel below, then click Run.</div>'
    setStatus('Waiting for both inputs','info')
    return
  }
  try{
    var objA=JSON.parse(a),objB=JSON.parse(b)
    var diffs=[]
    diffObjects(objA,objB,'',diffs)
    if(!diffs.length){
      document.getElementById('output-area').innerHTML='<div class="ok-msg">✓ JSON objects are identical</div>'
      setStatus('No differences','ok')
    }else{
      var html=diffs.map(function(d){
        if(d.type==='added')return'<div class="diff-added"><span class="diff-sign">+</span> <span class="diff-path">'+escKey(d.path)+'</span>: <span class="diff-val">'+escKey(JSON.stringify(d.b))+'</span></div>'
        if(d.type==='removed')return'<div class="diff-removed"><span class="diff-sign">-</span> <span class="diff-path">'+escKey(d.path)+'</span>: <span class="diff-val">'+escKey(JSON.stringify(d.a))+'</span></div>'
        return'<div class="diff-changed"><span class="diff-sign">~</span> <span class="diff-path">'+escKey(d.path)+'</span>: <span class="diff-val-old">'+escKey(JSON.stringify(d.a))+'</span> → <span class="diff-val-new">'+escKey(JSON.stringify(d.b))+'</span></div>'
      }).join('')
      document.getElementById('output-area').innerHTML=html
      setStatus(diffs.length+' difference'+(diffs.length!==1?'s':''),'err')
    }
  }catch(e){
    document.getElementById('output-area').innerHTML='<div class="err">⚠ '+escKey(e.message)+'</div>'
    setStatus('Parse error','err')
  }
}

function diffObjects(a,b,path,diffs){
  var allKeys=new Set([].concat(Object.keys(a||{}),Object.keys(b||{})))
  allKeys.forEach(function(k){
    var p=path?(path+'.'+k):k
    var av=a?a[k]:undefined,bv=b?b[k]:undefined
    if(av===undefined&&bv!==undefined){diffs.push({type:'added',path:p,b:bv})}
    else if(av!==undefined&&bv===undefined){diffs.push({type:'removed',path:p,a:av})}
    else if(typeof av==='object'&&av!==null&&typeof bv==='object'&&bv!==null&&!Array.isArray(av)&&!Array.isArray(bv)){
      diffObjects(av,bv,p,diffs)
    }else if(JSON.stringify(av)!==JSON.stringify(bv)){
      diffs.push({type:'changed',path:p,a:av,b:bv})
    }
  })
}

// ── JSONPath implementation (no library needed) ──────────
function runJSONPath(){
  var input=document.getElementById('input').value.trim()
  var query=(document.getElementById('jp-query')||{value:'$'}).value.trim()||'$'
  if(!input){document.getElementById('output-area').innerHTML='<div class="empty-msg">Paste JSON first.</div>';return}
  try{
    var obj=JSON.parse(input)
    var results=jsonPath(obj,query)
    var out=document.getElementById('output-area')
    if(!results||!results.length){
      out.innerHTML='<div style="padding:.85rem;color:var(--text-3);font-family:var(--font-mono);font-size:13px">No matches for: '+escKey(query)+'</div>'
      setStatus('0 matches','info')
    }else{
      out.innerHTML=syntaxHighlight(JSON.stringify(results.length===1?results[0]:results,null,2))
      setStatus(results.length+' match'+(results.length!==1?'es':''),'ok')
    }
  }catch(e){
    document.getElementById('output-area').innerHTML='<div class="err">⚠ '+escKey(e.message)+'</div>'
    setStatus('Error','err')
  }
}

// JSONPath engine — supports $, .key, ['key'], [n], [*], ..key, [?(@.key>val)]
function jsonPath(obj,expr){
  if(expr==='$'||expr==='')return[obj]
  var tokens=expr.replace(/^\$/,'').split(/(?=\.\.?|\[)/)
  function evaluate(nodes,token){
    var results=[]
    nodes.forEach(function(node){
      if(token.startsWith('..')){
        // Recursive descent
        var key=token.slice(2)
        function descend(v){
          if(typeof v!=='object'||v===null)return
          if(key==='*'||key===''){Object.values(Array.isArray(v)?v:v).forEach(function(c){results.push(c);descend(c)})}
          else{if(v[key]!==undefined)results.push(v[key]);Object.values(v).forEach(descend)}
        }
        descend(node)
      }else if(token.startsWith('[')){
        var inner=token.slice(1,-1)
        if(inner==='*'){
          if(Array.isArray(node))node.forEach(function(c){results.push(c)})
          else if(typeof node==='object'&&node!==null)Object.values(node).forEach(function(c){results.push(c)})
        }else if(inner.startsWith('?(')){
          // Filter expression [?(@.key op val)]
          var m=inner.match(/\?\(@\.(\w+)\s*([><=!]+)\s*(.+)\)/)
          if(m&&Array.isArray(node)){
            var fkey=m[1],fop=m[2],fval=JSON.parse(m[3])
            node.forEach(function(item){
              var iv=item[fkey]
              var pass=fop==='=='?iv==fval:fop==='!='?iv!=fval:fop==='>'?iv>fval:fop==='<'?iv<fval:fop==='>='?iv>=fval:iv<=fval
              if(pass)results.push(item)
            })
          }
        }else if(/^\d+$/.test(inner)){
          if(Array.isArray(node)&&node[parseInt(inner)]!==undefined)results.push(node[parseInt(inner)])
        }else{
          var k=inner.replace(/^['"]|['"]$/g,'')
          if(node&&node[k]!==undefined)results.push(node[k])
        }
      }else if(token.startsWith('.')){
        var k=token.slice(1)
        if(k==='*'){
          if(typeof node==='object'&&node!==null)Object.values(node).forEach(function(c){results.push(c)})
        }else if(node&&node[k]!==undefined){results.push(node[k])}
      }
    })
    return results
  }
  var nodes=[obj]
  tokens.filter(Boolean).forEach(function(t){nodes=evaluate(nodes,t)})
  return nodes
}

// ── JSON → TypeScript types ──────────────────────────────
function jsonToTypeScript(obj,name){
  var lines=['// Generated by JSON Studio — universeinvedors.tech','']
  var interfaces={}
  function inferType(val,key){
    if(val===null)return'null'
    if(Array.isArray(val)){
      if(!val.length)return'unknown[]'
      var inner=inferType(val[0],key)
      return inner+'[]'
    }
    if(typeof val==='object'){
      var tname=key?capitalize(key):'Obj'
      buildInterface(val,tname)
      return tname
    }
    return typeof val
  }
  function capitalize(s){return s.charAt(0).toUpperCase()+s.slice(1)}
  function buildInterface(obj,iname){
    if(interfaces[iname])return
    var fields=[]
    Object.keys(obj).forEach(function(k){
      var safeKey=/^[a-zA-Z_$][a-zA-Z0-9_$]*$/.test(k)?k:'"'+k+'"'
      var t=inferType(obj[k],k)
      fields.push('  '+safeKey+': '+t+';')
    })
    interfaces[iname]='export interface '+iname+' {\n'+fields.join('\n')+'\n}'
  }
  if(Array.isArray(obj)){
    var inner=obj.length?obj[0]:{}
    buildInterface(inner,name+'Item')
    lines.push('export type '+name+' = '+name+'Item[];')
  }else{
    buildInterface(obj,name)
  }
  Object.values(interfaces).forEach(function(i){lines.push(i);lines.push('')})
  return lines.join('\n')
}

// ── JSON → CSV ───────────────────────────────────────────
function jsonToCSV(obj){
  var arr=Array.isArray(obj)?obj:(obj&&typeof obj==='object'?[obj]:[])
  if(!arr.length)return'// No array data found'
  var keys=Array.from(new Set(arr.flatMap(Object.keys)))
  var rows=[keys.map(function(k){return'"'+k+'"'}).join(',')]
  arr.forEach(function(item){
    rows.push(keys.map(function(k){
      var v=item[k]
      if(v===null||v===undefined)return''
      if(typeof v==='object')return'"'+JSON.stringify(v).replace(/"/g,'""')+'"'
      if(typeof v==='string')return'"'+v.replace(/"/g,'""')+'"'
      return String(v)
    }).join(','))
  })
  return rows.join('\r\n')
}

// ── Tree view ────────────────────────────────────────────
function jsonToTree(val,key,isRoot){
  var type=Array.isArray(val)?'array':typeof val
  var html=''
  if(type==='object'||type==='array'){
    var open=type==='array'?'[':'{'
    var close=type==='array'?']':'}'
    var childKeys=type==='array'?[...Array(val.length).keys()]:Object.keys(val)
    html+='<details open><summary><span class="json-key">'+escKey(String(key))+'</span>: '+open+'<span style="color:var(--text-3);font-size:.85em"> '+childKeys.length+(type==='array'?' items':' keys')+'</span></summary>'
    childKeys.forEach(function(k){html+=jsonToTree(val[k],k,false)})
    html+=close+'</details>'
  }else{
    var cls=type==='string'?'json-string':type==='number'?'json-number':type==='boolean'?'json-bool':'json-null'
    var display=type==='string'?'"'+escKey(String(val))+'"':escKey(String(val))
    html+='<div style="padding:.1rem 0 .1rem 1rem"><span class="json-key">'+escKey(String(key))+'</span>: <span class="'+cls+'">'+display+'</span></div>'
  }
  return html
}

<script>
window.__TOUR_STEPS__ = [{sel:".topbar-logo",title:"Welcome to JSON Studio",body:"A complete JSON workspace � format, validate, convert, diff, query, and generate TypeScript types. 100% private, all runs in your browser.",tip:"bottom"},{sel:".etabs",title:"9 operations in one tool",body:"Format, Minify, Validate, CSV, YAML, TypeScript, Tree view, Diff, and JSONPath. Switch between them instantly with no page reload.",tip:"bottom"},{sel:"#input-pane",title:"Paste JSON here",body:"Paste any JSON � from an API, config file, or database export. Press Ctrl+Enter to run, or type and results update as you go.",tip:"right"},{sel:"#output-pane",title:"Syntax-highlighted output",body:"Keys, strings, numbers and booleans are colour-coded. Export as JSON, CSV, YAML or TypeScript using the download bar below.",tip:"left"},{sel:"#diff-row,#jp-row,.seo-footer",title:"Advanced features",body:"Try Diff mode to compare two JSON objects, or JSONPath to query nested data using path expressions like $.users[*].email.",tip:"top"}];

<script>
(function(){
  'use strict';
  var TOUR_KEY='ui_tour_'+(location.hostname.split('.')[0]||'tool');
  var steps=window.__TOUR_STEPS__||[];
  var current=0,active=false;
  var overlay,tipEl;

  function init(){
    if(!steps.length)return;
    overlay=document.createElement('div');
    overlay.id='tour-overlay';
    overlay.setAttribute('role','dialog');
    overlay.setAttribute('aria-modal','true');
    overlay.setAttribute('aria-label','Guided tour');

    var svgNS='http://www.w3.org/2000/svg';
    var svgEl=document.createElementNS(svgNS,'svg');
    svgEl.id='tour-svg';
    svgEl.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:9001;pointer-events:none';
    var defs=document.createElementNS(svgNS,'defs');
    var clip=document.createElementNS(svgNS,'clipPath');
    clip.id='tour-clip';
    var outerR=document.createElementNS(svgNS,'rect');
    outerR.setAttribute('width','200%');outerR.setAttribute('height','200%');
    var holeR=document.createElementNS(svgNS,'rect');
    holeR.id='tour-hole';
    clip.appendChild(outerR);clip.appendChild(holeR);defs.appendChild(clip);
    var dimR=document.createElementNS(svgNS,'rect');
    dimR.setAttribute('width','200%');dimR.setAttribute('height','200%');
    dimR.setAttribute('clip-path','url(#tour-clip)');
    dimR.setAttribute('fill','rgba(3,5,10,0.78)');
    var glowR=document.createElementNS(svgNS,'rect');
    glowR.id='tour-glow';
    glowR.setAttribute('fill','none');
    glowR.setAttribute('stroke','rgba(59,130,246,0.55)');
    glowR.setAttribute('stroke-width','2');
    svgEl.appendChild(defs);svgEl.appendChild(dimR);svgEl.appendChild(glowR);
    overlay.appendChild(svgEl);

    tipEl=document.createElement('div');
    tipEl.id='tour-tip';
    tipEl.innerHTML=
      '<div class="tour-progress"><div class="tour-progress-fill" id="tour-pfill"></div></div>'+
      '<div class="tour-step-label" id="tour-slbl"></div>'+
      '<div class="tour-tip-title" id="tour-ttl"></div>'+
      '<div class="tour-tip-body" id="tour-tbdy"></div>'+
      '<div class="tour-footer">'+
        '<div class="tour-dots" id="tour-dots"></div>'+
        '<div class="tour-nav">'+
          '<button class="tour-nav-btn tour-prev" id="tour-prev" onclick="__tourPrev()" aria-label="Previous">&#8592; Prev</button>'+
          '<button class="tour-nav-btn tour-next" id="tour-next" onclick="__tourNext()" aria-label="Next">Next &#8594;</button>'+
        '</div>'+
      '</div>'+
      '<button class="tour-skip" onclick="endTour()">Skip tour &times;</button>';
    overlay.appendChild(tipEl);
    document.body.appendChild(overlay);

    overlay.addEventListener('click',function(e){if(e.target===overlay)endTour();});
    document.addEventListener('keydown',function(e){
      if(!active)return;
      if(e.key==='Escape')endTour();
      if(e.key==='ArrowRight'||e.key==='Enter')__tourNext();
      if(e.key==='ArrowLeft')__tourPrev();
    });

    renderDots();
    var seen=localStorage.getItem(TOUR_KEY);
    if(!seen)setTimeout(function(){startTour();},1500);
  }

  function renderDots(){
    var d=document.getElementById('tour-dots');
    if(!d)return;
    d.innerHTML=steps.map(function(_,i){
      return'<div class="tour-dot'+(i===current?' active':'')+'" onclick="__tourGo('+i+')" tabindex="0" role="button" aria-label="Step '+(i+1)+'"></div>';
    }).join('');
  }

  function spotlight(el){
    if(!el)return;
    var r=el.getBoundingClientRect(),p=10,rx=10;
    var x=r.left-p,y=r.top-p,w=r.width+p*2,h=r.height+p*2;
    var hole=document.getElementById('tour-hole');
    var glow=document.getElementById('tour-glow');
    if(hole){hole.setAttribute('x',x);hole.setAttribute('y',y);hole.setAttribute('width',w);hole.setAttribute('height',h);hole.setAttribute('rx',rx);}
    if(glow){glow.setAttribute('x',x);glow.setAttribute('y',y);glow.setAttribute('width',w);glow.setAttribute('height',h);glow.setAttribute('rx',rx);}
    el.scrollIntoView({behavior:'smooth',block:'nearest',inline:'nearest'});
  }

  function positionTip(el,side){
    if(!tipEl||!el)return;
    tipEl.className='';
    var r=el.getBoundingClientRect();
    var tw=tipEl.offsetWidth||320,th=tipEl.offsetHeight||220;
    var vw=window.innerWidth,vh=window.innerHeight,m=16;
    var top,left,arrow;
    if(side==='bottom'&&r.bottom+th+m<vh){top=r.bottom+m;left=r.left;arrow='top';}
    else if(side==='top'&&r.top-th-m>0){top=r.top-th-m;left=r.left;arrow='bottom';}
    else if(side==='right'&&r.right+tw+m<vw){top=r.top;left=r.right+m;arrow='left';}
    else if(side==='left'&&r.left-tw-m>0){top=r.top;left=r.left-tw-m;arrow='right';}
    else{top=Math.min(r.bottom+m,vh-th-m);left=r.left;arrow='top';}
    left=Math.max(m,Math.min(left,vw-tw-m));
    top=Math.max(m+56,Math.min(top,vh-th-m));
    tipEl.style.top=top+'px';tipEl.style.left=left+'px';
    tipEl.classList.add('arrow-'+arrow);
  }

  function renderStep(idx){
    if(idx<0||idx>=steps.length)return;
    current=idx;
    var step=steps[idx],total=steps.length;
    var el=step.sel?document.querySelector(step.sel):null;
    document.getElementById('tour-slbl').textContent='Step '+(idx+1)+' of '+total;
    document.getElementById('tour-ttl').textContent=step.title||'';
    document.getElementById('tour-tbdy').textContent=step.body||'';
    var pf=document.getElementById('tour-pfill');
    if(pf)pf.style.width=Math.round(((idx+1)/total)*100)+'%';
    var prev=document.getElementById('tour-prev');
    var next=document.getElementById('tour-next');
    if(prev)prev.style.display=idx===0?'none':'';
    if(next)next.textContent=idx===total-1?'Finish \u2713':'Next \u2192';
    document.querySelectorAll('.tour-dot').forEach(function(d,i){d.classList.toggle('active',i===idx);});
    if(el){
      spotlight(el);
      setTimeout(function(){positionTip(el,step.tip||'bottom');},80);
    }else{
      var hole=document.getElementById('tour-hole');
      if(hole){hole.setAttribute('width','0');hole.setAttribute('height','0');}
      tipEl.style.top='50%';tipEl.style.left='50%';
      tipEl.style.transform='translate(-50%,-50%)';
    }
  }

  window.__tourGo=function(i){if(active)renderStep(i);};
  window.__tourNext=function(){if(!active)return;if(current>=steps.length-1){endTour();return;}renderStep(current+1);};
  window.__tourPrev=function(){if(active&&current>0)renderStep(current-1);};

  window.startTour=function(){
    if(!steps.length)return;
    active=true;current=0;
    overlay.classList.add('active');
    document.body.style.overflow='hidden';
    renderStep(0);
  };

  window.endTour=function(){
    active=false;
    if(overlay)overlay.classList.remove('active');
    document.body.style.overflow='';
    localStorage.setItem(TOUR_KEY,'1');
  };

  window.resetTour=function(){localStorage.removeItem(TOUR_KEY);};

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',init);
  }else{
    setTimeout(init,0);
  }
})();

</script>

textarea{flex:1;width:100%;padding:.85rem;font-family:var(--font-mono);font-size:13px;line-height:1.6;background:var(--bg-base);color:var(--text-1);border:none;resize:none;outline:none;tab-size:2}
textarea::selection{background:rgba(59,130,246,.25)}
#output-area{flex:1;overflow:auto;padding:.85rem;background:var(--bg-base);font-family:var(--font-mono);font-size:13px;line-height:1.6;color:var(--text-2);white-space:pre-wrap;word-break:break-all}
#output-area .json-key{color:var(--accent-light)} #output-area .json-string{color:#34d399} #output-area .json-number{color:#fb923c} #output-area .json-bool{color:#60a5fa} #output-area .json-null{color:var(--text-3)}
.err{color:#f87171;padding:1rem;font-family:var(--font-mono);background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.2);border-radius:var(--r-md);margin:1rem;white-space:pre-wrap}
.ok-msg{color:var(--green);padding:.65rem .85rem;background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.2);border-radius:var(--r-md);font-size:.8rem;margin:.65rem}
.divider{width:4px;background:var(--bg-base);cursor:col-resize;flex-shrink:0;transition:background var(--t)}.divider:hover{background:var(--accent)}
/* Diff output styles */
.diff-added{background:rgba(16,185,129,.08);border-left:3px solid var(--green);padding:.15rem .5rem;white-space:pre-wrap;word-break:break-all;font-size:12.5px}
.diff-removed{background:rgba(239,68,68,.08);border-left:3px solid #ef4444;padding:.15rem .5rem;white-space:pre-wrap;word-break:break-all;font-size:12.5px}
.diff-changed{background:rgba(245,158,11,.08);border-left:3px solid var(--yellow);padding:.15rem .5rem;white-space:pre-wrap;word-break:break-all;font-size:12.5px}
.diff-sign{display:inline-block;width:14px;color:inherit;font-weight:700;opacity:.7}
.diff-path{color:var(--accent-light)}
.diff-val{color:var(--text-2)}
.diff-val-old{color:#f87171;text-decoration:line-through;opacity:.7}
.diff-val-new{color:#34d399}
details>summary{cursor:pointer;list-style:none;padding:.1rem 0;user-select:none}
details>summary::-webkit-details-marker{display:none}
@media(max-width:700px){.main{flex-direction:column}.divider{display:none}}

/* Tour CSS */
.tour-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.26rem .6rem;border-radius:8px;font-size:.72rem;font-weight:700;cursor:pointer;border:1px solid rgba(59,130,246,.35);background:rgba(59,130,246,.10);color:#60a5fa;transition:all .18s;white-space:nowrap;flex-shrink:0}.tour-btn:hover{background:rgba(59,130,246,.20);border-color:rgba(59,130,246,.6)}.tour-btn svg{width:13px;height:13px}#tour-overlay{position:fixed;inset:0;z-index:9000;pointer-events:none;opacity:0;transition:opacity .3s}#tour-overlay.active{pointer-events:auto;opacity:1}#tour-svg{position:fixed;inset:0;width:100%;height:100%;z-index:9001;pointer-events:none}#tour-tip{position:fixed;z-index:9002;width:min(320px,calc(100vw - 2rem));background:#111b2e;border:1px solid rgba(59,130,246,.4);border-radius:16px;padding:1.2rem 1.35rem 1rem;box-shadow:0 24px 64px rgba(0,0,0,.7);animation:tourPop .22s cubic-bezier(.34,1.56,.64,1)}@keyframes tourPop{from{opacity:0;transform:scale(.9) translateY(6px)}to{opacity:1;transform:scale(1) translateY(0)}}.tour-step-label{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#60a5fa;margin-bottom:.4rem}.tour-tip-title{font-size:.97rem;font-weight:800;color:#f0f4ff;margin-bottom:.35rem}.tour-tip-body{font-size:.82rem;color:#a8b8cf;line-height:1.6;margin-bottom:.9rem}.tour-footer{display:flex;align-items:center;gap:.5rem;margin-top:.35rem}.tour-dots{display:flex;gap:.3rem;flex:1}.tour-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.15);transition:all .2s;cursor:pointer}.tour-dot.active{background:#3b82f6;width:18px;border-radius:3px}.tour-nav{display:flex;gap:.4rem}.tour-nav-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.32rem .75rem;border-radius:8px;font-size:.75rem;font-weight:700;cursor:pointer;border:none;transition:all .18s}.tour-prev{background:rgba(255,255,255,.07);color:#a8b8cf;border:1px solid rgba(255,255,255,.1)}.tour-prev:hover{background:rgba(255,255,255,.12)}.tour-next{background:#3b82f6;color:#fff}.tour-next:hover{background:#60a5fa}.tour-skip{background:none;border:none;font-size:.72rem;color:#5a6a82;cursor:pointer;padding:.3rem;display:block;margin-top:.4rem;transition:color .18s}.tour-skip:hover{color:#a8b8cf}.tour-progress{height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;margin-bottom:.8rem}.tour-progress-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#06b6d4);border-radius:2px;transition:width .3s}#tour-tip.arrow-top::before,#tour-tip.arrow-bottom::before,#tour-tip.arrow-left::before,#tour-tip.arrow-right::before{content:'';position:absolute;width:10px;height:10px;background:#111b2e;border:1px solid rgba(59,130,246,.4);transform:rotate(45deg)}#tour-tip.arrow-top::before{top:-6px;left:24px;border-right:none;border-bottom:none}#tour-tip.arrow-bottom::before{bottom:-6px;left:24px;border-left:none;border-top:none}#tour-tip.arrow-left::before{left:-6px;top:20px;border-right:none;border-top:none}#tour-tip.arrow-right::before{right:-6px;top:20px;border-left:none;border-bottom:none}
