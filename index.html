<script>
var currentOp='format'
var SAMPLE='{"users":[{"id":1,"name":"Alice","email":"alice@example.com","role":"admin","active":true,"created":"2024-01-15"},{"id":2,"name":"Bob","email":"bob@example.com","role":"user","active":true,"created":"2024-02-20"},{"id":3,"name":"Carol","email":"carol@example.com","role":"guest","active":false,"created":"2024-03-10"}],"meta":{"total":3,"page":1,"perPage":10},"timestamp":1698000000000}'

function setOp(op){
  currentOp=op
  document.querySelectorAll('.et').forEach(function(t){t.classList.remove('active')})
  var btn=document.getElementById('et-'+op)
  if(btn)btn.classList.add('active')
  // For diff mode, show second input
  if(op==='diff'){
    document.getElementById('input').placeholder='Paste first JSON here...'
  }
  runOp()
}

function runOp(){
  var input=document.getElementById('input').value.trim()
  if(!input){document.getElementById('output-area').innerHTML='<span style="color:var(--text-4)">Paste JSON in the input panel…</span>';return}
  var out=document.getElementById('output-area')
  out.innerHTML=''
  try{
    var parsed=JSON.parse(input)
    if(currentOp==='format'){
      out.innerHTML=syntaxHighlight(JSON.stringify(parsed,null,2))
      setStatus('Formatted ✓','ok')
    }else if(currentOp==='minify'){
      out.innerHTML=syntaxHighlight(JSON.stringify(parsed))
      setStatus('Minified ✓','ok')
    }else if(currentOp==='validate'){
      out.innerHTML='<div class="ok-msg">✓ Valid JSON — '+(JSON.stringify(parsed).length)+' bytes</div>'
      setStatus('Valid ✓','ok')
    }else if(currentOp==='csv'){
      out.textContent=jsonToCSV(parsed)
      setStatus('CSV ✓','ok')
    }else if(currentOp==='yaml'){
      if(window.jsyaml){
        out.textContent=jsyaml.dump(parsed)
        setStatus('YAML ✓','ok')
      }else{out.innerHTML='<div class="err">YAML library not loaded. Try again.</div>'}
    }else if(currentOp==='tree'){
      out.innerHTML=jsonToTree(parsed,'root',true)
      setStatus('Tree view ✓','ok')
    }else if(currentOp==='diff'){
      out.innerHTML='<div style="padding:1rem;color:var(--t2);font-size:.85rem">Diff mode: paste a second JSON below and click Run to compare.<br><br>For now, this validates your JSON and shows structure.</div>'+syntaxHighlight(JSON.stringify(parsed,null,2))
      setStatus('Diff mode','info')
    }
  }catch(e){
    out.innerHTML='<div class="err">⚠ '+e.message+'</div>'
    setStatus('Error','err')
  }
}

function syntaxHighlight(json){
  json=json.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+\.?\d*([eE][+\-]?\d+)?)/g,function(match){
    var cls='json-number'
    if(/^"/.test(match)){cls=/:$/.test(match)?'json-key':'json-string'}
    else if(/true|false/.test(match)){cls='json-bool'}
    else if(/null/.test(match)){cls='json-null'}
    return '<span class="'+cls+'">'+match+'</span>'
  })
}

function jsonToCSV(obj){
  var arr=Array.isArray(obj)?obj:(obj&&Array.isArray(Object.values(obj)[0])?Object.values(obj)[0]:[obj])
  if(!arr.length)return'No array data found'
  var keys=Object.keys(arr[0])
  var rows=[keys.join(',')]
  arr.forEach(function(item){
    rows.push(keys.map(function(k){
      var v=item[k]
      if(v===null||v===undefined)return''
      if(typeof v==='object')return'"'+JSON.stringify(v).replace(/"/g,'""')+'"'
      if(typeof v==='string'&&v.includes(','))return'"'+v.replace(/"/g,'""')+'"'
      return String(v)
    }).join(','))
  })
  return rows.join('\n')
}

function jsonToTree(obj,key,isLast){
  var html='<div style="margin-left:1rem">'
  var type=Array.isArray(obj)?'array':typeof obj
  html+='<span class="json-key">"'+key+'"</span>: '
  if(type==='object'||type==='array'){
    var open=type==='array'?'[':'{'
    var close=type==='array'?']':'}'
    html+=open+'<br>'
    var keys=type==='array'?obj.map(function(v,i){return i}):Object.keys(obj)
    keys.forEach(function(k,i){
      var val=type==='array'?obj[k]:obj[k]
      var last=i===keys.length-1
      if(typeof val==='object'&&val!==null){
        html+=jsonToTree(val,k,last)
      }else{
        html+='<div style="margin-left:1rem"><span class="json-key">"'+k+'"</span>: '
        if(typeof val==='string')html+='<span class="json-string">"'+val+'"</span>'
        else if(typeof val==='number')html+='<span class="json-number">'+val+'</span>'
        else if(typeof val==='boolean')html+='<span class="json-bool">'+val+'</span>'
        else html+='<span class="json-null">null</span>'
        html+=(last?'':',')+'</div>'
      }
    })
    html+='<div>'+close+(isLast?'':',')+'</div>'
  }
  html+='</div>'
  return html
}

function updateSize(){
  var v=document.getElementById('input').value
  document.getElementById('input-size').textContent=v.length+' chars'
}

function setStatus(msg,type){
  var s=document.getElementById('output-status')
  s.textContent=msg
  s.style.color=type==='ok'?'var(--green)':type==='err'?'#f87171':type==='info'?'var(--acc-h)':'var(--text-4)'
}

function loadSample(){document.getElementById('input').value=SAMPLE;updateSize();runOp();toast('Sample loaded','ok')}
function clearAll(){document.getElementById('input').value='';document.getElementById('output-area').innerHTML='Output will appear here…';updateSize();setStatus('Ready','')}
function copyOutput(){
  var text=document.getElementById('output-area').textContent
  if(!text||text==='Output will appear here…'){toast('Nothing to copy','err');return}
  navigator.clipboard.writeText(text).then(function(){toast('Copied','ok')})
}
function toast(msg,type){var e=document.createElement('div');e.className='toast'+(type?' '+type:'');e.textContent=msg;document.getElementById('toasts').appendChild(e);setTimeout(function(){e.remove()},2800)}

// Resizer
;(function(){
  var inputPane=document.getElementById('input-pane')
  var dragging=false,startX,startW
  document.querySelector('.divider')||document.addEventListener('mousedown',function(e){
    if(e.target.classList.contains('divider')){dragging=true;startX=e.clientX;startW=inputPane.offsetWidth;document.body.style.cssText='cursor:col-resize;user-select:none'}
  })
  document.addEventListener('mousemove',function(e){if(!dragging)return;inputPane.style.width=Math.max(150,Math.min(window.innerWidth-150,startW+e.clientX-startX))+'px'})
  document.addEventListener('mouseup',function(){if(dragging){dragging=false;document.body.style.cssText=''}})
})()
</script>
<script>

  document.querySelectorAll('.tab,.et,[data-tab]').forEach(function(tab){
